name: Testes Python

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - "requirements*.txt"
      - "pytest.ini"
      - ".github/workflows/python-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - "requirements*.txt"
      - "pytest.ini"
      - ".github/workflows/python-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Pytest com Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Atualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Verificar sintaxe do script
        run: python -m py_compile scripts/update_mercado_livre.py

      - name: Executar testes automatizados
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m pytest
